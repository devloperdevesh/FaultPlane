name: Go Control-Plane Linting Guardian

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  golangci:
    name: Execute Strict Static Code Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Production Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Enterprise golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          args: --timeout=5m --issues-exit-code=1
