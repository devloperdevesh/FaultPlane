# SPDX-License-Identifier: Apache-2.0

name: Go Control-Plane Linting Guardian

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci:
    name: Execute Strict Static Code Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Up Production Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

          - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v8
          with:
            version: v1.64.8
            args: --timeout=5m