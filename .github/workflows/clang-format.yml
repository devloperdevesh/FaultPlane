name: Linux Kernel C-Style Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  clang-format:
    name: Verify Clang Code Alignment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Automated Clang Format Linter
        uses: moxitrel/clang-format-action@v1
        with:
          style: LLVM
          extensions: 'c,h'
