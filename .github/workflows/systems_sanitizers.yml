name: Hardened Systems Sanitizers & Concurrency Fuzzing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  systems-fuzz-and-sanitize:
    name: Execute Low-Level Concurrency & Memory Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Up Production Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run Race Detection
        run: |
          go test -race -v -timeout=5m ./pkg/failover/...

      - name: Run Address Sanitizer
        run: |
          go test -asan -v -timeout=5m ./pkg/failover/...

      - name: Run Failover Fuzz Tests
        run: |
          go test -fuzz=Fuzz -fuzztime=60s ./pkg/failover/...
