name: eBPF Bytecode Fuzzing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bpf-fuzz:
    name: Run Low-Level Bytecode Injection Testing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run eBPF Gateway Tests
        run: |
          go test -v ./internal/gateway/bpf/...

      - name: Run Full Go Test Suite
        run: |
          go test ./...
