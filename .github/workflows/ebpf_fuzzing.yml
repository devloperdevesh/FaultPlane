name: eBPF Bytecode Security Fuzzing Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bpf-fuzz:
    name: Run Low-Level Bytecode Injection Testing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Kernel Tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm bpftool libbpf-dev

      - name: Compile and Fuzz BPF Bytecode
        run: |
          clang -O2 -g -target bpf -c internal/kernel/bpf/sockmap.bpf.c -o internal/kernel/bpf/sockmap.bpf.o
          # Verify that the generated ELF object conforms to strict Linux verification layouts
          bpftool feature probe || true
