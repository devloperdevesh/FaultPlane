name: Enterprise Contributor Welcome Guardian

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage-and-greet:
    name: Sub-Kernel Compliance Triage
    runs-on: ubuntu-24.04

    steps:
      - name: Execute Automated Structural Triage
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const sender = context.payload.sender.login;

            const message = [
              `### Welcome to the FaultPlane project, @${sender}!`,
              ``,
              `Thank you for opening this thread. Your contribution helps improve the FaultPlane transport data-plane proxy.`,
              ``,
              `### Contribution Guidelines`,
              ``,
              `- **Issues:** Include reproducible steps, relevant logs, and environment details when applicable.`,
              `- **Pull Requests:** Ensure tests, static analysis, and relevant validation checks pass before requesting review.`,
              `- **Performance-sensitive changes:** Include benchmark or profiling evidence when the change affects the data path.`,
              ``,
              `Maintainers will review the submission and follow up as needed.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });
